######################## default configuration ####################
baseURL = "/"
title = "Fulcrum"
languageName = "En"
languageCode = "en-us"
# post pagination
paginate = "6"
# post excerpt
summaryLength = "10"
# disqus short name
disqusShortname = "" # get your shortname form here : https://disqus.com
# disable language
disableLanguages = [] # disable language from here
# google analytics
googleAnalytics = "" # example : UA-123-45


############################## Output ###############################
[outputs]
home = ["HTML", "RSS", "JSON"]

# unsafe html
[markup.goldmark.renderer]
unsafe = true

[taxonomies]
category = "categories"
tag = "tags"
author = "author"

############################## navigation ###############################

# main menu
[[menu.main]]
name = "Home"
URL = "/"
weight = 1

[[menu.main]]
name = "Blog"
URL = "blog/"
weight = 2

[[menu.main]]
name = "Contact"
URL = "contact/"
weight = 3

# only desktop menu
[[menu.desktop]]
name = "Contact"
URL = "contact/"
weight = 1


#################### default parameters ################################
[params]
# Meta data
description = "This is meta description"
author = "Themefisher"

# favicon
[params.favicon]
favicon = "images/favicon.png"

# cookies
[params.cookies]
enable = true
expire_days = 14

# banner
[params.banner]
heading = "Transform Your Brand’s Voice & Expertise into Organic Growth"
subheading = "Content that converts. Strategy that scales. Fulcrum is your storytelling engine for leads and loyalty."
image = "images/fulcrumstast2.jpg"

# blog
# [params.blog]
# heading = ""

# call to action
[params.call_to_action]
enable = true
title = ""
content = ""
button_label = "Start Your Content Journey →"
button_url = "contact/"

# gallery
[params.gallery]
enable = false

[[params.gallery.gallery_item]]
image = "images/2020-square-2.png"

[[params.gallery.gallery_item]]
image = "images/2020-square-1.png"


# footer
[params.footer]
copyright = "Copyright &copy; FULCRUM MEDIA 2025"

############################# social site ########################
[params.social]
